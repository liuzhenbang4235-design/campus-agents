<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通达校园资料收集</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:24px}main{max-width:720px;margin:auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #17203318}h1{margin-top:0}p{color:#667085}.notice{background:#fff7e6;border:1px solid #ffd591;padding:12px;border-radius:10px}.grid{display:grid;gap:14px}label{font-weight:600}input,select,textarea{width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}button{background:#2844db;color:#fff;border:0;padding:12px 18px;border-radius:9px;font-weight:700;cursor:pointer}.small{font-size:13px;color:#667085}#result{margin-top:14px;white-space:pre-wrap}</style></head><body><main><h1>通达校园资料收集</h1><p>欢迎提交通达学院的校园生活、办事流程、地点和价格信息。</p><div class="notice">提交内容需要管理员审核。请不要填写手机号、身份证号、取件码等个人敏感信息。</div><form id="f" class="grid"><label>资料标题<input name="title" required maxlength="80" placeholder="例如：二食堂茶香鸡菜单"></label><label>资料类型<select name="kind"><option>校园生活</option><option>学校事务</option><option>学习资料</option></select></label><label>资料来源<input name="source" required maxlength="150" placeholder="本人实地看到 / 学校通知 / 店家公告"></label><label>核实日期<input type="date" name="date"></label><label>内容<textarea name="content" required maxlength="20000" rows="8" placeholder="填写地点、价格、营业时间或办理流程"></textarea></label><label><input type="checkbox" required> 我确认内容不含个人敏感信息，并同意提交审核</label><button>生成投稿文件</button></form><div id="result" class="small"></div></main><script>f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.submittedAt=new Date().toISOString();const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='通达校园投稿-'+Date.now()+'.json';a.click();result.textContent='投稿内容已整理成文件并下载。当前云端数据库尚未接通，请将这个文件发给管理员导入审核。';f.reset()}</script></body></html>
