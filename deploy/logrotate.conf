# =============================================================================
# 校集 Campus Agent — nginx 访问/错误日志轮转
# 放置：/etc/logrotate.d/campus-agent
# 验证：sudo logrotate -d /etc/logrotate.d/campus-agent
#
# 说明：
#   - 仅适用于 Linux + logrotate；macOS 没有 logrotate，launchd 日志用 newsyslog。
#   - 应用以 systemd 运行时日志进 journald，由 journald 自己轮转，不在此处理。
#   - Caddy 默认已在 Caddyfile 中 roll_size/roll_keep 自轮转，通常无需再加。
#   - Debian/Ubuntu 的 nginx 日志属主通常是 www-data:adm；
#     RHEL/Alma 系通常是 nginx:nginx。请按发行版修改 create 行。
# =============================================================================

/var/log/nginx/campus-agent.access.log
/var/log/nginx/campus-agent.error.log {
    weekly
    rotate 8
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    sharedscripts
    postrotate
        if command -v systemctl >/dev/null 2>&1; then
            systemctl reload nginx >/dev/null 2>&1 || true
        else
            nginx -s reopen >/dev/null 2>&1 || true
        fi
    endscript
}

# 如果 Caddy 没有启用内置 roll_size，可改用下面这段（取消注释并删掉 Caddyfile 里的 roll_*）：
#
# /var/log/caddy/campus-agent.access.log {
#     weekly
#     rotate 8
#     missingok
#     notifempty
#     compress
#     delaycompress
#     create 0640 caddy caddy
#     sharedscripts
#     postrotate
#         systemctl reload caddy >/dev/null 2>&1 || true
#     endscript
# }
