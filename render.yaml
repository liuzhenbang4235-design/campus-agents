# Campus Agent web service.
# Free instances spin down after inactivity (about 15 minutes) and cold-start
# on the next request. Do not switch this plan just to keep the process awake.
# No persistent disk: free web services cannot attach one. data/ is gitignored,
# so a new instance starts from lib/seed.json. Writes under data/ and
# config.local.json disappear on restart or redeploy. Cloud model keys belong
# in CAMPUS_AI_* so a free-tier restart still has them. Never commit key values.
services:
  - type: web
    name: campus-agents
    runtime: node
    plan: free
    # Zero dependencies. Skip npm install; the start script is `node server.cjs`.
    buildCommand: node --check server.cjs
    startCommand: node server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Render's proxy is outside the process. Loopback would fail health checks.
      - key: HOST
        value: "0.0.0.0"
      # Literal value, not sync:false, so a Blueprint sync turns public mode on.
      # Local preview omits this env and keeps demo-identity switching.
      # Dashboard can still override to 0 for a private preview service.
      - key: PUBLIC_MODE
        value: "1"
      # Operator fills https://<service>.onrender.com (and later the custom domain).
      # sync:false is prompted once at Blueprint creation and is not overwritten later.
      - key: CAMPUS_ORIGINS
        sync: false
      # Shared password until Cloudflare Access is in front of a custom domain.
      # Both must be set or the gate stays off. Never put the values in git.
      - key: ACCESS_USER
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
      # Cloud model. Values stay in the Dashboard and survive free-tier restarts.
      # Leave CAMPUS_AI_DAILY_LIMIT empty to keep the default of 50.
      - key: CAMPUS_AI_ENABLED
        sync: false
      - key: CAMPUS_AI_PROVIDER
        sync: false
      - key: CAMPUS_AI_API_KEY
        sync: false
      - key: CAMPUS_AI_MODEL
        sync: false
      - key: CAMPUS_AI_DAILY_LIMIT
        sync: false
