<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通达校园资料收集</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f5f7fb;padding:24px;color:#172033}main{max-width:680px;margin:auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 8px 30px #17203318}label{display:block;font-weight:600;margin-top:14px}input,select,textarea{box-sizing:border-box;width:100%;margin-top:6px;padding:10px;border:1px solid #ccd2dd;border-radius:8px;font:inherit}input[type=checkbox]{width:auto;margin-right:8px}.check{font-weight:400}.notice{padding:12px;background:#fff7e6;margin:15px 0;border-radius:8px;color:#694b00}button{margin-top:18px;padding:11px 18px;background:#2844db;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}#r{white-space:pre-wrap}.small{font-size:13px;color:#667085}</style></head>
<body><main><h1>通达校园资料收集</h1><p>欢迎提交通达学院的校园生活、办事流程、地点和价格信息。</p><div class="notice">欢迎填写昵称，让校园里的其他同学记住你的贡献。提交内容会先由管理员审核；请勿填写手机号、身份证号、取件码等个人敏感信息。</div><form id="f"><label>昵称（可选）<input name="nickname" maxlength="30" placeholder="例如：通达小张"></label><label>资料标题<input name="title" required maxlength="80" placeholder="例如：二食堂茶香鸡菜单"></label><label>资料类型<select name="kind"><option>校园生活</option><option>学校事务</option><option>学习资料</option></select></label><label>资料来源<input name="source" required maxlength="150" placeholder="本人实地看到 / 学校通知"></label><label>核实日期<input type="date" name="date"></label><label>内容<textarea name="content" required maxlength="20000" rows="8" placeholder="填写地点、价格、营业时间或办理流程"></textarea></label><label>上传附件（可选，最多 5 个，每个不超过 8 MB）<input id="files" type="file" accept="image/*,.doc,.docx,.pdf,.txt,.md" multiple><span class="small">支持图片、Word、PDF、TXT、Markdown，可上传菜单、价目表、位置或公告。</span></label><label class="check"><input type="checkbox" required>我确认内容不含个人敏感信息，并同意提交审核</label><button>生成投稿文件</button></form><p id="r" class="small"></p></main><script>const f=document.getElementById('f'),r=document.getElementById('r');f.onsubmit=async e=>{e.preventDefault();const files=[...document.getElementById('files').files];if(files.length>5)return r.textContent='最多上传 5 个附件。';if(files.some(x=>x.size>8*1024*1024))return r.textContent='单个附件不能超过 8 MB。';const attachments=await Promise.all(files.map(x=>new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok({name:x.name,type:x.type,size:x.size,dataUrl:fr.result});fr.onerror=no;fr.readAsDataURL(x)})));const d=Object.fromEntries(new FormData(f));d.attachments=attachments;d.submittedAt=new Date().toISOString();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='通达校园投稿-'+Date.now()+'.json';a.click();r.textContent='投稿文件已下载，已包含 '+attachments.length+' 个附件。请将文件发给管理员导入审核。';f.reset()}</script></body></html>
